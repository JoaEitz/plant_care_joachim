[project]
name = "plant-care"
version = "1.2.0"
requires-python = ">=3.13.2,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "homeassistant==2026.2.3",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-homeassistant-custom-component>=0.13.200",
  "ruff>=0.9",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
