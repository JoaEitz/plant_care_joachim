create_plant:
  name: Create plant
  description: >
    Creates a new Plant Care plant programmatically.
    Duplicate plant names receive unique internal IDs automatically.

  fields:

    plant_name:
      name: Plant name
      required: true
      selector:
        text:

    plant_species:
      name: Species
      description: Optional botanical or common species name.
      required: false
      selector:
        text:

    area_name:
      name: Room
      description: >
        Home Assistant area assigned to the new plant.
      required: false
      selector:
        text:

    image_media_content_id:
      name: Plant image
      description: >
        Local Home Assistant media-source image used as the plant photo.
      required: false
      selector:
        text:

    watering_interval_days:
      name: Watering interval
      required: false
      default: 7
      selector:
        number:
          min: 0
          max: 365
          step: 1
          mode: box
          unit_of_measurement: days

    fertilizing_interval_days:
      name: Fertilizing interval
      required: false
      default: 30
      selector:
        number:
          min: 0
          max: 365
          step: 1
          mode: box
          unit_of_measurement: days

    moisture_min:
      name: Minimum soil moisture
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: box
          unit_of_measurement: "%"

    moisture_max:
      name: Maximum soil moisture
      required: false
      default: 100
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: box
          unit_of_measurement: "%"

    humidity_min:
      name: Minimum humidity
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: box
          unit_of_measurement: "%"

    humidity_max:
      name: Maximum humidity
      required: false
      default: 100
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: box
          unit_of_measurement: "%"

    temp_min:
      name: Minimum temperature
      required: false
      default: 10
      selector:
        number:
          min: -20
          max: 60
          step: 0.5
          mode: box
          unit_of_measurement: "°C"

    temp_max:
      name: Maximum temperature
      required: false
      default: 30
      selector:
        number:
          min: -20
          max: 60
          step: 0.5
          mode: box
          unit_of_measurement: "°C"

    light_min:
      name: Minimum light
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 200000
          step: 100
          mode: box
          unit_of_measurement: lx

    light_max:
      name: Maximum light
      required: false
      default: 100000
      selector:
        number:
          min: 0
          max: 200000
          step: 100
          mode: box
          unit_of_measurement: lx

    temp_entity_id:
      name: Temperature sensor
      required: false
      selector:
        entity:
          domain: sensor

    humidity_entity_id:
      name: Humidity sensor
      required: false
      selector:
        entity:
          domain: sensor

    moisture_entity_id:
      name: Soil moisture sensor
      required: false
      selector:
        entity:
          domain: sensor

    light_entity_id:
      name: Illuminance sensor
      required: false
      selector:
        entity:
          domain: sensor

    conductivity_entity_id:
      name: Conductivity sensor
      required: false
      selector:
        entity:
          domain: sensor

analyze_plant:
  name: Analyze plant health
  description: >
    Analyzes a current plant image together with care state and aggregated sensor
    history, persists the result, and updates the plant's AI entities.
  supports_response: optional
  target:
    device:
      integration: plant_care
  fields:
    plant_id:
      name: Plant ID
      description: Stable Plant Care ID; use this only when no device is targeted.
      required: false
      selector:
        text:
    config_entry_id:
      name: Config entry ID
      description: Plant Care config entry ID; use this only when no device is targeted.
      required: false
      selector:
        text:
    image_entity:
      name: Image entity
      description: Optional camera or image entity overriding the configured source.
      required: false
      selector:
        entity:
          domain:
            - camera
            - image
    image_media_content_id:
      name: Local media image
      description: >
        Optional media-source://media_source/local/... ID overriding the configured source.
      required: false
      selector:
        text:
    image_path:
      name: Image file path
      description: >
        Optional Home Assistant allowlisted local file path overriding the configured source.
      required: false
      advanced: true
      selector:
        text:

get_analysis_history:
  name: Get plant analysis history
  description: Returns a bounded list of persisted AI analyses for a future frontend.
  supports_response: only
  target:
    device:
      integration: plant_care
  fields:
    plant_id:
      name: Plant ID
      description: Stable Plant Care ID; use this only when no device is targeted.
      required: false
      selector:
        text:
    config_entry_id:
      name: Config entry ID
      description: Plant Care config entry ID; use this only when no device is targeted.
      required: false
      selector:
        text:
    limit:
      name: Limit
      description: Number of recent analyses to return.
      required: false
      default: 20
      selector:
        number:
          min: 1
          max: 20
          step: 1
          mode: box
